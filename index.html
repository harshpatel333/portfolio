<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>harsh — terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3efe4; --win:#faf7ee; --bar:#efe9da; --scroll:#f6f2e8;
  --border:#e0d8c5; --border-hi:#cdc2a8;
  --text:#34302a; --muted:#6b6557; --dim:#9a9384;
  --green:#1f7a4a; --green-deep:#2f8f5b; --blue:#2f6fb0; --amber:#b5791a; --coral:#c0492b;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--mono); background:var(--bg); color:var(--text);
  font-size:14px; line-height:1.7; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(800px 480px at 75% -8%,rgba(73,201,138,0.05),transparent 70%);
  display:flex; align-items:center; justify-content:center; padding:22px;
}
::selection{background:rgba(103,230,164,0.25); color:#fff}
a{color:var(--blue); text-decoration:none} a:hover{color:var(--green); text-decoration:underline}

.window{
  width:100%; max-width:880px; height:min(86vh,720px);
  background:var(--win); border:1px solid var(--border); border-radius:11px;
  display:flex; flex-direction:column; overflow:hidden;
  box-shadow:0 24px 70px -28px rgba(0,0,0,0.85);
}
.titlebar{
  display:flex; align-items:center; gap:9px; padding:0 14px; height:38px;
  background:var(--bar); border-bottom:1px solid var(--border); flex:none;
}
.dot{width:11px; height:11px; border-radius:50%}
.title{margin-left:10px; font-size:12.5px; color:var(--muted)}
.title b{color:var(--text); font-weight:500}

.screen{
  flex:1; overflow-y:auto; padding:20px 22px 8px; background:var(--scroll); position:relative;
  scrollbar-width:thin; scrollbar-color:var(--border-hi) transparent;
}
.screen::-webkit-scrollbar{width:9px}
.screen::-webkit-scrollbar-thumb{background:var(--border-hi); border-radius:9px}

/* banner */
.banner{border:1px solid var(--border-hi); border-radius:8px; padding:15px 18px; margin-bottom:18px; max-width:560px}
.banner .star{color:var(--green)}
.banner .t1{color:var(--text); font-weight:500}
.banner .t2{color:var(--muted); margin-top:9px; font-size:13px}
.banner .t2 .k{color:var(--green-deep)}

/* printed blocks */
.echo{color:var(--muted); margin-top:14px}
.echo .pr{color:var(--green-deep)} .echo .pa{color:var(--blue)} .echo .sym{color:var(--dim)} .echo .c{color:var(--text)}
.out{margin:6px 0 4px}
.out p{max-width:66ch; color:var(--muted)} .out p+p{margin-top:10px}
.out b{color:var(--text); font-weight:500} .out .g{color:var(--green-deep)}

.proj-line{color:var(--muted)}
.proj-line .nm{color:var(--text); font-weight:500}
.proj-line .pm{color:var(--dim)} .proj-line .sl{color:var(--green-deep)}

.detail{border-left:2px solid var(--green); padding:2px 0 2px 16px; margin:4px 0}
.detail .h{color:var(--text); font-weight:700; font-size:15px}
.detail .yr{color:var(--dim); font-weight:400; font-size:12px; margin-left:8px}
.detail .d{color:var(--muted); margin:8px 0 11px; max-width:64ch}
.detail .d b{color:var(--text); font-weight:500}
.chips{display:flex; gap:7px; flex-wrap:wrap}
.chip{font-size:11.5px; color:var(--green-deep); background:rgba(73,201,138,0.07); border:1px solid var(--border); padding:3px 9px; border-radius:5px}
.links{margin-top:11px; display:flex; gap:18px; flex-wrap:wrap; font-size:13px}

/* neofetch */
.fetch{display:flex; gap:30px; flex-wrap:wrap}
.ascii{color:var(--green); line-height:1.3; white-space:pre; font-size:12px}
.nf .row{display:flex; gap:10px}
.nf .key{color:var(--green-deep); min-width:96px; font-weight:500}
.nf .val{color:var(--muted)} .nf .val b{color:var(--text); font-weight:400}
.nf .hr{height:1px; background:var(--border); margin:8px 0; max-width:300px}
.nf .sw{display:inline-block; width:15px; height:15px; border-radius:3px; margin-right:4px; margin-top:8px}
.gh-wrap{margin-top:18px; overflow-x:auto; padding-bottom:2px}
.gh-cap{color:var(--dim); font-size:12px; margin-bottom:5px} .gh-cap a{color:var(--blue)}
.gh-cal{display:block; max-width:100%}
.gh-cal text{fill:var(--dim); font-size:9px; font-family:var(--mono)}
.gh-cal .c0{fill:var(--muted); fill-opacity:.14} .gh-cal .c1{fill:var(--green); fill-opacity:.32} .gh-cal .c2{fill:var(--green); fill-opacity:.55} .gh-cal .c3{fill:var(--green); fill-opacity:.78} .gh-cal .c4{fill:var(--green); fill-opacity:1}
.gh-legend{display:flex; align-items:center; gap:5px; margin-top:9px; color:var(--dim); font-size:11px}
.gh-legend i{width:11px; height:11px; border-radius:2px; display:inline-block}

.contact .row{color:var(--muted)} .contact .k{color:var(--green-deep)} .contact .lbl{display:inline-block; min-width:92px; color:var(--dim)}
.help .row{color:var(--muted); padding:1px 0} .help .cmd{color:var(--green-deep); min-width:120px; display:inline-block}

.about-row{display:flex; gap:26px; align-items:flex-start; flex-wrap:wrap}
.me-ascii{flex:none; white-space:pre; font-family:var(--mono); font-size:7px; line-height:7px; color:var(--text); margin-top:3px; opacity:.92}
.about-text{flex:1; min-width:280px}
@media(max-width:600px){ .me-ascii{font-size:6px; line-height:6px} }
/* experience timeline */
.exp{margin-top:4px}
.exp-item{position:relative; padding:0 0 20px 22px; border-left:1px solid var(--border); margin-left:4px}
.exp-item:last-child{border-left-color:transparent; padding-bottom:2px}
.exp-dot{position:absolute; left:-5px; top:6px; width:9px; height:9px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px var(--scroll)}
.exp-role{color:var(--text); font-weight:700; font-size:15px}
.exp-co{color:var(--blue); font-size:14px; margin-top:1px}
.exp-date{color:var(--dim); font-size:12px; margin-top:2px}
.exp-desc{color:var(--muted); font-size:13.5px; line-height:1.6; margin-top:8px; max-width:64ch}

/* prompt + menu */
.dock{flex:none; border-top:1px solid var(--border); background:var(--win)}
.menu{padding:10px 22px 4px}
.menu-label{color:var(--dim); font-size:12px; margin-bottom:6px}
.opt{display:flex; align-items:baseline; gap:10px; padding:3px 8px; border-radius:6px; cursor:pointer}
.opt .ptr{color:var(--green); width:12px; opacity:0}
.opt .label{color:var(--muted); min-width:150px}
.opt .desc{color:var(--dim); font-size:12.5px}
.opt.sel{background:rgba(103,230,164,0.08)}
.opt.sel .ptr{opacity:1}
.opt.sel .label{color:var(--green); font-weight:500}
.opt.sel .desc{color:var(--muted)}
.nomatch{color:var(--dim); padding:4px 8px; font-size:13px}

.promptline{display:flex; align-items:center; padding:9px 22px; gap:0; border-top:1px solid var(--border)}
.promptline .pr{color:var(--green-deep)} .promptline .pa{color:var(--blue)} .promptline .sym{color:var(--dim); margin-right:8px}
#inp{flex:1; background:transparent; border:none; outline:none; color:var(--text); font-family:var(--mono); font-size:14px; caret-color:var(--green)}
#inp::placeholder{color:var(--dim)}

.hints{padding:7px 22px; background:var(--bar); border-top:1px solid var(--border); font-size:11.5px; color:var(--dim); display:flex; gap:16px; flex-wrap:wrap}
.hints b{color:var(--muted); font-weight:500}
.hints .kbd{color:var(--green-deep)}

.dot.max{cursor:pointer}
body.fs{padding:0}
body.fs .window{width:100%; height:100vh; max-width:none; border:none; border-radius:0; box-shadow:none}

@media(max-width:600px){
  body{padding:0}
  .window{height:100vh; max-width:none; border:none; border-radius:0}
  .ascii{display:none}
  .opt .label{min-width:110px}
  .hints .hide-sm{display:none}
}
</style>
</head>
<body class="fs">
<div class="window">
  <div class="titlebar">
    <span class="dot" style="background:#ff5f57"></span>
    <span class="dot" style="background:#febc2e"></span>
    <span class="dot max" id="maxbtn" title="restore" style="background:#28c840"></span>
    <span class="title"><b>portfolio</b>@harsh: ~ — zsh</span>
  </div>

  <div class="screen" id="screen">
    <div class="banner">
      <div class="t1"><span class="star">✻</span> welcome to harsh.cv</div>
      <div class="t2">founding engineer · building <b style="color:var(--text)">Series</b><br>
      <span class="k">↑ ↓</span> to move · <span class="k">↵</span> to select · or just start typing</div>
    </div>
  </div>

  <div class="dock">
    <div class="menu" id="menu"></div>
    <div class="promptline">
      <span class="pr" id="pr-user">portfolio@harsh</span><span class="sym">:</span><span class="pa" id="pr-path">~</span><span class="sym">$</span>
      <input id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type a command (or use the menu)…">
    </div>
    <div class="hints">
      <span><b class="kbd">↑↓</b> navigate</span>
      <span><b class="kbd">↵</b> select</span>
      <span><b class="kbd">esc</b> back</span>
      <span class="hide-sm"><b class="kbd">tab</b> autocomplete</span>
      <span class="hide-sm">type <b>help</b> for commands</span>
    </div>
  </div>
</div>

<script>
(function(){

  };
  var currentTheme = 'paper';
  function applyTheme(k){
    var t=themes[k]; if(!t) return; var r=document.documentElement.style;

    r.setProperty('--scroll',t.scroll); r.setProperty('--border',t.border); r.setProperty('--border-hi',t.borderHi);
    r.setProperty('--text',t.text); r.setProperty('--muted',t.muted); r.setProperty('--dim',t.dim);

    r.setProperty('--blue',t.blue); r.setProperty('--amber',t.amber); r.setProperty('--coral',t.coral);
    currentTheme=k;
  }

  /* ---------- content ---------- */
  var projects = [
    { id:'joy', year:'present', perm:'drwxr-xr-x',
      desc:'A phone built around <b>you</b>. From the moment you wake up — through your commute, your 10 o’clock, the grocery run, winding down at night — Joy assists at every step, remembering what matters and anticipating what’s next, so your attention goes to the things that count. Today it runs on a re-imaged Pixel 9 Pro XL with our own Android-based OS and fully <b>on-device inference</b> (Gemma 4 E4B) behind a context-aware memory system. It’s the first OS layer of its kind, built from the ground up on on-device LLM power. We’re starting with the people who most feel the absence of an executive assistant — builders and founders, then knowledge workers — and we believe most people will one day carry a Joy Phone. Purpose-built hardware comes next.',

    { id:'ai-web-browser', year:'2025', perm:'drwxr-xr-x',

      stack:['Python','Selenium','LLM agents'],

    { id:'nba-predictor', year:'2024', perm:'drwxr-xr-x',

      stack:['Python','Selenium'],

  var experience = [
    { role:'Founding Engineer', org:'Series', date:'Jul 2025 — Present',
      desc:'Building the first AI social network — featured in Forbes, Business Insider, and TechCrunch, and viral across X and LinkedIn. $5.1M raised to date, with more in progress. I architect the scalable infrastructure behind real-time AI interactions and viral social experiences at massive scale.' },
    { role:'Founder & CEO', org:'CourseBite Web Services', date:'2025 — Present',

  var mode = 'home';            // 'home' | 'work'

  function esc(s){ return s; }
  function scrollDown(){ screen.scrollTop = screen.scrollHeight; }

  }

    var path = (mode==='work') ? '~/projects' : (mode==='theme' ? '~/themes' : '~');

  var ghData={ start:'2025-06-01', total:3074, levels:'000000000000000000001100000000000000000010000000001001011111111111111111121110010121111100003233211221121012121112113400112011101213001221400011110012111000111100111121111221221010010112220012213211221211101000000101001121101100000121000001122110101110012210001111100112232011021001110100323110001231001110100022441012411000344111311210020424101421000022210112213001111' };
  function fetchContrib(){
    try{
      fetch('https://github-contributions-api.jogruber.de/v4/harshpatel333?y=last')
        .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
        .then(function(d){
          var arr = d && d.contributions ? d.contributions : [];
          if(arr.length){
            ghData.start = arr[0].date;
            ghData.total = (d.total && d.total.lastYear) || arr.reduce(function(s,c){return s+(c.count||0);},0);
            ghData.levels = arr.map(function(c){ return c.level; }).join('');
          }
        })
        .catch(function(){});
    }catch(e){}
  }
  function renderContrib(){
    var cell=12, gap=3, step=cell+gap, top=16;
    var startD=new Date(ghData.start+'T00:00:00Z'); var sd=startD.getUTCDay();
    var n=ghData.levels.length, weeks=Math.ceil((sd+n)/7);
    var W=weeks*step-gap, H=7*step-gap+top;
    var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var rects='', labels='', lastM=-1, col;
    for(col=0; col<weeks; col++){
      var di=col*7 - sd; var dt=new Date(startD.getTime()+di*86400000); var m=dt.getUTCMonth();
      if(m!==lastM){ labels+='<text x="'+(col*step)+'" y="10">'+M[m]+'</text>'; lastM=m; }
    }
    for(var i=0;i<n;i++){ var idx=sd+i, c=Math.floor(idx/7), r=idx%7, lvl=ghData.levels.charAt(i);
      rects+='<rect class="c'+lvl+'" x="'+(c*step)+'" y="'+(r*step+top)+'" width="'+cell+'" height="'+cell+'" rx="2"/>'; }
    return '<svg class="gh-cal" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+ghData.total+' GitHub contributions in the last year">'+labels+rects+'</svg>';
  }

  function hrow(c,d){ return '<div class="row"><span class="cmd">'+c+'</span>'+d+'</div>'; }

  function cmdClear(){ screen.innerHTML=''; lastEcho=null; }

  function enterWork(){
    echo('cd projects && ls -la');
    var html='<div class="out">';
    projects.forEach(function(p){
      html+='<div class="proj-line"><span class="pm">'+p.perm+'</span>  <span class="sl">./</span><span class="nm">'+p.id+'</span>  <span class="pm">'+p.year+'</span></div>';

  function openProject(p){
    echo('open '+p.id);
    var chips=p.stack.map(function(s){return '<span class="chip">'+s+'</span>';}).join('');
    var links=p.links.map(function(l){return '<a href="'+l[1]+'" target="_blank" rel="noopener">'+l[0]+' →</a>';}).join('');
    print('<div class="out"><div class="detail">'+
      '<div class="h">'+p.id+'<span class="yr">'+p.year+'</span></div>'+
      '<div class="d">'+p.desc+'</div>'+
      '<div class="chips">'+chips+'</div>'+
      '<div class="links">'+links+'</div>'+
      '</div></div>');
  }
  function goHome(){ echo('cd ..'); setMode('home'); }

  /* ---------- themes (interactive) ---------- */
  function themeMenu(){
    var items = Object.keys(themes).map(function(k){
      return { id:k, label:k+(k===currentTheme?'  ●':''), desc:themes[k].desc, run:function(){ setTheme(k); } };
    });
    items.push({ id:'back', label:'cd ..', desc:'back to home', run:goHome });
    return items;
  }
  function enterTheme(){
    echo('theme');
    print('<div class="out"><p style="color:var(--dim);font-size:13px">'+Object.keys(themes).length+' palettes — ↑ ↓ + ↵ to preview live · <span style="color:var(--green-deep)">cd ..</span> to go back</p></div>');
    setMode('theme');
  }
  function setTheme(k){
    applyTheme(k);
    echo('theme '+k);
    print('<div class="out"><p style="color:var(--muted)">→ applied <b>'+k+'</b> — '+themes[k].desc+'</p></div>');
    if(mode==='theme'){ current=themeMenu(); renderMenu(); }
  }

  /* ---------- mode + menu rendering ---------- */
  function menuFor(m){ if(m==='work') return workMenu(); if(m==='theme') return themeMenu(); return homeMenu; }
  function pathFor(m){ if(m==='work') return '~/projects'; if(m==='theme') return '~/themes'; return '~'; }
  function labelFor(m){ if(m==='work') return 'open a project'; if(m==='theme') return 'choose a theme — applies live'; return 'select a command'; }
  function setMode(m){
    mode = m;
    current = menuFor(m);
    prPath.textContent = pathFor(m);
    inp.value=''; sel=0; renderMenu();
  }
  function applyFilter(){
    var q = inp.value.trim().toLowerCase();
    filtered = q ? current.filter(function(i){ return i.id.indexOf(q)===0 || i.label.toLowerCase().indexOf(q)===0; }) : current.slice();
    if(sel>=filtered.length) sel=filtered.length?filtered.length-1:0;
  }
  function renderMenu(){
    applyFilter();
    if(!filtered.length){
      menuEl.innerHTML='<div class="menu-label">'+(mode==='work'?'~/projects':(mode==='theme'?'themes':'commands'))+'</div><div class="nomatch">no match — press ↵ to run "'+inp.value.trim()+'" anyway, or keep typing</div>';
      return;
    }
    var label = labelFor(mode);
    var html='<div class="menu-label">'+label+'</div>';
    filtered.forEach(function(it,i){
      html+='<div class="opt'+(i===sel?' sel':'')+'" data-i="'+i+'"><span class="ptr">❯</span><span class="label">'+it.label+'</span><span class="desc">'+it.desc+'</span></div>';
    });
    menuEl.innerHTML=html;
    Array.prototype.forEach.call(menuEl.querySelectorAll('.opt'),function(el){
      el.addEventListener('mouseenter',function(){ sel=+el.getAttribute('data-i'); paintSel(); });
      el.addEventListener('click',function(){ sel=+el.getAttribute('data-i'); choose(); });
    });
  }
  function paintSel(){
    Array.prototype.forEach.call(menuEl.querySelectorAll('.opt'),function(el,i){
      el.classList.toggle('sel', i===sel);
    });
  }
  function choose(){
    if(filtered.length){
      var it=filtered[sel];
      inp.value=''; renderMenu();
      it.run();
      scrollNewToTop();
    } else {
      runRaw(inp.value.trim());
    }
  }
  function runRaw(raw){
    inp.value='';
    var cmd=raw.toLowerCase();
    var globals={ 'clear':cmdClear,'help':cmdHelp,'about':cmdAbout,'experience':cmdExperience,'exp':cmdExperience,'cv':cmdExperience,'resume':cmdExperience,'education':cmdEducation,'edu':cmdEducation,'stack':cmdStack,'contact':cmdContact,'work':enterWork,'ls':enterWork };
    if(cmd==='cd ..'||cmd==='back'||cmd==='home'||cmd==='..'){ if(mode!=='home'){ goHome(); scrollNewToTop(); } else { renderMenu(); } return; }
    if(cmd==='theme'){ enterTheme(); scrollNewToTop(); return; }
    if(cmd==='fullscreen'||cmd==='fs'){ echo(cmd); toggleFS(); renderMenu(); scrollNewToTop(); return; }
    if(cmd.indexOf('theme ')===0){ var tk=cmd.slice(6).trim(); if(themes[tk]){ setTheme(tk); } else { echo(raw); print('<div class="out"><p style="color:var(--coral)">no such theme: '+tk+' — try <b style="color:var(--text)">theme</b></p></div>'); } renderMenu(); scrollNewToTop(); return; }
    var proj=projects.filter(function(p){return p.id===cmd;})[0];
    if(proj){ if(mode!=='work') setMode('work'); openProject(proj); scrollNewToTop(); return; }
    if(globals[cmd]){ globals[cmd](); renderMenu(); scrollNewToTop(); return; }
    echo(raw||''); print('<div class="out"><p style="color:var(--coral)">command not found: '+(raw||'')+' \u2014 type <b style="color:var(--text)">help</b></p></div>');
    renderMenu(); scrollNewToTop();
  }

  /* ---------- key handling ---------- */
  inp.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'){ e.preventDefault(); if(filtered.length){ sel=(sel+1)%filtered.length; paintSel(); } }
    else if(e.key==='ArrowUp'){ e.preventDefault(); if(filtered.length){ sel=(sel-1+filtered.length)%filtered.length; paintSel(); } }
    else if(e.key==='Enter'){ e.preventDefault(); choose(); }
    else if(e.key==='Escape'){ e.preventDefault(); if(inp.value){ inp.value=''; renderMenu(); } else if(mode!=='home'){ goHome(); } }
    else if(e.key==='Tab'){ e.preventDefault(); if(filtered.length){ inp.value=filtered[sel].id; renderMenu(); } }
  });
  inp.addEventListener('input',function(){ sel=0; renderMenu(); });

  document.querySelector('.window').addEventListener('click',function(e){ if(e.target.tagName!=='A') inp.focus(); });

  /* ---------- fullscreen ---------- */
  function toggleFS(){
    var on = document.body.classList.toggle('fs');
    var btn = document.getElementById('maxbtn'); if(btn) btn.title = on ? 'restore' : 'maximize';
    try{
      if(on && document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen().catch(function(){}); }
      else if(!on && document.fullscreenElement && document.exitFullscreen){ document.exitFullscreen().catch(function(){}); }
    }catch(e){}
    scrollDown(); inp.focus();
  }
  document.getElementById('maxbtn').addEventListener('click',function(e){ e.stopPropagation(); toggleFS(); });
  document.addEventListener('fullscreenchange',function(){
    if(!document.fullscreenElement){ document.body.classList.remove('fs'); var b=document.getElementById('maxbtn'); if(b) b.title='maximize'; }
  });

  /* ---------- boot ---------- */
  fetchContrib();
  renderMenu();
  inp.focus();
})();
